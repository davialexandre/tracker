<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <style>
        html, body {
            margin: 0;
        }
        #map {
            height: 100vh;
        }
        #loading {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            padding: 8px 16px;
            border-radius: 4px;
            z-index: 1000;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div id="loading">Loading...</div>
<script type="application/javascript">
    var map = L.map('map', {zoomSnap: 0.25, preferCanvas: true}).setView([-23.54574186833512, -46.608589765419296], 14);
    var CartoDB_Positron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    });

    var currentSpeed = 8.5;
    var layerGroup = L.layerGroup().addTo(map);
    var abortController = null;
    var moveTimeout = null;
    var loadingEl = document.getElementById('loading');

    var SpeedControl = L.Control.extend({
        onAdd: function() {
            var container = L.DomUtil.create('input');
            container.type = 'number';
            container.min = 0;
            container.step = 0.5;
            container.value = currentSpeed;
            container.onchange = function() {
                currentSpeed = parseFloat(container.value) || 8.5;
                fetchLocations();
            };
            L.DomEvent.disableClickPropagation(container);
            return container;
        }
    });

    (new SpeedControl()).addTo(map);
    CartoDB_Positron.addTo(map);

    var geoJsonStyle = { color: '#006cff', weight: 2 };

    function fetchLocations() {
        if (abortController) abortController.abort();
        abortController = new AbortController();
        layerGroup.clearLayers();

        var bounds = map.getBounds();
        var baseParams = {
            speed: currentSpeed,
            south: bounds.getSouth(),
            north: bounds.getNorth(),
            west: bounds.getWest(),
            east: bounds.getEast(),
            limit: 100000
        };

        loadingEl.style.display = 'block';
        loadChunk(baseParams, null);
    }

    function loadChunk(baseParams, cursor) {
        var params = new URLSearchParams(baseParams);
        if (cursor) params.set('cursor', cursor);

        fetch('/locations.php?' + params.toString(), { signal: abortController.signal })
            .then(function(response) { return response.json(); })
            .then(function(json) {
                if (json.features && json.features.length > 0) {
                    L.geoJSON(json, { style: function() { return geoJsonStyle; } })
                        .addTo(layerGroup);
                }

                if (json.hasMore && json.nextCursor) {
                    loadChunk(baseParams, json.nextCursor);
                } else {
                    loadingEl.style.display = 'none';
                }
            })
            .catch(function(e) {
                loadingEl.style.display = 'none';
                if (e.name !== 'AbortError') console.error(e);
            });
    }

    map.on('moveend', function() {
        clearTimeout(moveTimeout);
        moveTimeout = setTimeout(fetchLocations, 300);
    });

    fetchLocations();
</script>
</body>
</html>
