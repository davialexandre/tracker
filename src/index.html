<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <style>
        html, body {
            margin: 0;
        }
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script type="application/javascript" async="async">
    var map = L.map('map', {zoomSnap: 0.25}).setView([-23.54574186833512, -46.608589765419296], 14);
    var CartoDB_Positron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    });

    var SpeedControl = L.Control.extend({
        onAdd: function() {
            var container = L.DomUtil.create('input');
            container.type = 'number';
            container.min = 0;
            container.onchange = function() {
                fetchLocations(container.value);
            };

            return container;
        }
    });

    (new SpeedControl()).addTo(map);
    CartoDB_Positron.addTo(map);

    function fetchLocations(speed) {
        map.eachLayer(function (layer) {
            if (layer instanceof L.GeoJSON) {
                map.removeLayer(layer);
            }
        });
        
        let offset = 0;
        const chunkSize = 50000;
        
        function loadChunk() {
            fetch(`/locations.php?speed=${speed}&limit=${chunkSize}&offset=${offset}`)
                .then((response) => {
                    response.json().then((json) => {
                        if (json.features && json.features.length > 0) {
                            L.geoJSON(json, {
                                style: function (feature) {
                                    return { 'color': feature.properties.color, weight: 2 }
                                }
                            }).addTo(map);
                        }
                        
                        // Load next chunk if there's more data
                        if (json.hasMore) {
                            offset += chunkSize;
                            setTimeout(loadChunk, 100); // Small delay to prevent overwhelming
                        }
                    });
                });
        }
        
        loadChunk();
    }

    fetchLocations(8.5);
    </script>
</body>
</html>
