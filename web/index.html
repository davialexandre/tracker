<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <style>
        html, body {
            margin: 0;
        }
        #map {
            height: 100vh;
        }
        #loading {
            display: none;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 8px 16px;
            border-radius: 4px;
            z-index: 1000;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 14px;
        }
        #topbar {
            position: fixed;
            top: 10px;
            left: 60px;
            z-index: 1000;
        }
        .icon-btn {
            background: white;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            border: none;
            cursor: pointer;
            color: #006cff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-family: sans-serif;
        }
        .icon-btn:hover { background: #f5f5f5; }
        #locate-btn.active {
            background: #006cff;
            color: white;
        }
        #locate-btn.active:hover { background: #0058d4; }
        #menu-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }
        #menu-panel {
            position: fixed;
            background: white;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            z-index: 1000;
            font-family: sans-serif;
            font-size: 13px;
            width: min(320px, calc(100vw - 20px));
            box-sizing: border-box;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
        }
        #menu-panel[hidden] { display: none; }
        #menu-panel .section {
            padding: 6px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #menu-panel .section-label {
            text-transform: uppercase;
            font-size: 11px;
            color: #888;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        #menu-panel hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 0;
        }
        #menu-panel .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        #menu-panel .preset-row button {
            background: white;
            border: 1px solid #ddd;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #006cff;
            font-family: inherit;
        }
        #menu-panel .preset-row button:hover { background: #f5f5f5; }
        #menu-panel #year-select {
            font: inherit;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: white;
        }
        #menu-panel .date-row,
        #menu-panel .filter-row {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333;
        }
        #menu-panel .date-row label { width: 42px; }
        #menu-panel .filter-row label { flex: 1; }
        #menu-panel .date-row input[type="date"] {
            flex: 1;
            font: inherit;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            min-width: 0;
        }
        #menu-panel .filter-row input[type="number"] {
            width: 80px;
            font: inherit;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            text-align: right;
        }
        #menu-panel #date-clear-btn,
        #menu-panel #reset-color-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #333;
            text-align: left;
            font-family: inherit;
            align-self: flex-start;
        }
        #menu-panel #date-clear-btn:hover,
        #menu-panel #reset-color-btn:hover { background: #f5f5f5; }
        #menu-panel .picker-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            color: #333;
            cursor: pointer;
        }
        #menu-panel .picker-row input[type="color"] {
            width: 30px;
            height: 24px;
            padding: 0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            background: white;
        }
        #menu-panel .menu-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #006cff;
            text-decoration: none;
            padding: 6px 0;
            font-family: inherit;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
    <button id="locate-btn" class="icon-btn" type="button" title="Locate me" aria-label="Locate me">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="1" x2="12" y2="4" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="20" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
            <line x1="1" y1="12" x2="4" y2="12" stroke="currentColor" stroke-width="2"/>
            <line x1="20" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>
        </svg>
    </button>
</div>
<button id="menu-btn" class="icon-btn" type="button" title="More" aria-label="More" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="5" r="2" fill="currentColor"/>
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
        <circle cx="12" cy="19" r="2" fill="currentColor"/>
    </svg>
</button>
<div id="menu-panel" role="menu" hidden>
    <div class="section">
        <div class="section-label">Dates</div>
        <div class="preset-row">
            <button type="button" data-preset="today">Today</button>
            <button type="button" data-preset="this-week">This week</button>
            <button type="button" data-preset="this-month">This month</button>
            <button type="button" data-preset="this-year">This year</button>
            <button type="button" data-preset="last-year">Last year</button>
        </div>
        <select id="year-select" hidden>
            <option value="">Year…</option>
        </select>
        <div class="date-row">
            <label for="date-from">From</label>
            <input id="date-from" type="date">
        </div>
        <div class="date-row">
            <label for="date-to">To</label>
            <input id="date-to" type="date">
        </div>
        <button id="date-clear-btn" type="button">Clear</button>
    </div>
    <hr>
    <div class="section">
        <div class="section-label">Filters</div>
        <div class="filter-row">
            <label for="speed-input">Max speed (m/s)</label>
            <input id="speed-input" type="number" min="0" step="0.5" value="8.5" title="Max speed (m/s)">
        </div>
        <div class="filter-row">
            <label for="accuracy-input">Max accuracy (m)</label>
            <input id="accuracy-input" type="number" min="0" step="5" value="15" placeholder="acc m" title="Max accuracy radius (m). Empty = no filter.">
        </div>
    </div>
    <hr>
    <div class="section">
        <div class="section-label">Line color</div>
        <label class="picker-row">
            <input id="nativeColor" type="color">
            <span>Pick a color</span>
        </label>
        <button id="reset-color-btn" type="button">Reset to default</button>
    </div>
    <hr>
    <a id="import-link" href="/import.html" class="menu-link">Import GPX <span aria-hidden="true">›</span></a>
</div>
<div id="loading">Loading...</div>
<script type="application/javascript">
    // On phones (viewport < 600px), open and locate at street zoom.
    var INITIAL_ZOOM = window.innerWidth < 600 ? 17 : 14;
    var map = L.map('map', {zoomSnap: 0.25, preferCanvas: true}).setView([-23.54574186833512, -46.608589765419296], INITIAL_ZOOM);
    var CartoDB_Positron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    });

    var currentSpeed = 8.5;
    var currentAccMax = 15; // meters; 0 = no accuracy filter
    var currentFrom = null; // 'YYYY-MM-DD' or null
    var currentTo = null;   // 'YYYY-MM-DD' or null
    var yearsCache = null; // { min, max } once fetched, or null
    var layerGroup = L.layerGroup().addTo(map);
    var abortController = null;
    var moveTimeout = null;
    var loadingEl = document.getElementById('loading');

    CartoDB_Positron.addTo(map);

    // Dedicated pane (and renderer) for the location dot so it always
    // paints above the line layers regardless of load order.
    map.createPane('locationPane');
    map.getPane('locationPane').style.zIndex = 650;
    var locationRenderer = L.canvas({ pane: 'locationPane' });

    var DEFAULT_LINE_COLOR = '#0d9488';
    var LINE_COLOR_KEY = 'tracker.lineColor';
    var HEX_RE = /^#[0-9a-fA-F]{6}$/;

    function readStoredLineColor() {
        try {
            var v = localStorage.getItem(LINE_COLOR_KEY);
            if (v && HEX_RE.test(v)) return v;
        } catch (e) {}
        return DEFAULT_LINE_COLOR;
    }

    var currentLineColor = readStoredLineColor();
    var geoJsonStyle = { color: currentLineColor, weight: 2 };

    function applyLineColor(hex) {
        currentLineColor = hex;
        geoJsonStyle.color = hex;
        layerGroup.eachLayer(function(layer) {
            layer.setStyle({ color: hex });
        });
        document.getElementById('nativeColor').value = hex;
        try { localStorage.setItem(LINE_COLOR_KEY, hex); } catch (e) {}
    }

    function dateStringToUnixStart(yyyyMmDd) {
        // Treat yyyy-mm-dd as local midnight.
        return Math.floor(new Date(yyyyMmDd + 'T00:00:00').getTime() / 1000);
    }

    // Single funnel that every UI path (manual inputs, presets, year dropdown,
    // Clear button) goes through. Keeps the inputs, state vars, and fetch in sync.
    function setRange(from, to) {
        currentFrom = from || null;
        currentTo   = to   || null;
        document.getElementById('date-from').value = currentFrom || '';
        document.getElementById('date-to').value   = currentTo   || '';
        fetchLocations();
    }

    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function fmtDate(d) {
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    // Returns the Monday of the ISO week containing `d`, as a fresh Date at local 00:00.
    function isoWeekMonday(d) {
        var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        // JS getDay(): Sun=0, Mon=1, ..., Sat=6. ISO week starts Monday.
        var dow = m.getDay();
        var diff = (dow === 0) ? -6 : (1 - dow); // shift to Monday
        m.setDate(m.getDate() + diff);
        return m;
    }

    function presetRange(name) {
        var today = new Date();
        var y = today.getFullYear(), mo = today.getMonth();
        switch (name) {
            case 'today':
                return [fmtDate(today), fmtDate(today)];
            case 'this-week': {
                var mon = isoWeekMonday(today);
                var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
                return [fmtDate(mon), fmtDate(sun)];
            }
            case 'this-month': {
                var first = new Date(y, mo, 1);
                var last  = new Date(y, mo + 1, 0); // day 0 of next month = last day of this month
                return [fmtDate(first), fmtDate(last)];
            }
            case 'this-year':
                return [y + '-01-01', y + '-12-31'];
            case 'last-year':
                return [(y - 1) + '-01-01', (y - 1) + '-12-31'];
        }
        return [null, null];
    }

    function loadYearsOnce() {
        if (yearsCache !== null) return;
        fetch('/years.php')
            .then(function(r) { return r.json(); })
            .then(function(json) {
                yearsCache = json || { min: null, max: null };
                populateYearSelect();
            })
            .catch(function(e) {
                console.error('years.php failed', e);
                yearsCache = { min: null, max: null };
            });
    }

    function populateYearSelect() {
        var sel = document.getElementById('year-select');
        if (!yearsCache || yearsCache.min == null || yearsCache.max == null) {
            sel.hidden = true;
            return;
        }
        // Build options descending: most recent year first.
        var opts = ['<option value="">Year…</option>'];
        for (var y = yearsCache.max; y >= yearsCache.min; y--) {
            opts.push('<option value="' + y + '">' + y + '</option>');
        }
        sel.innerHTML = opts.join('');
        sel.hidden = false;
    }

    // Full reset: clear all data and reload for the current viewport.
    // Called on initial load and when speed filter changes.
    function fetchLocations() {
        if (abortController) abortController.abort();
        abortController = new AbortController();
        layerGroup.clearLayers();
        loadViewportData();
    }

    // Load data for the current viewport, accumulating onto existing layers.
    // Called on pan/zoom to fill in newly visible areas without clearing.
    function loadViewportData() {
        if (abortController) abortController.abort();
        abortController = new AbortController();

        var bounds = map.getBounds();
        var baseParams = {
            speed: currentSpeed,
            south: bounds.getSouth(),
            north: bounds.getNorth(),
            west: bounds.getWest(),
            east: bounds.getEast(),
            limit: 100000
        };
        if (currentAccMax > 0) baseParams.acc_max = currentAccMax;
        if (currentFrom) baseParams.from = dateStringToUnixStart(currentFrom);
        if (currentTo)   baseParams.to   = dateStringToUnixStart(currentTo) + 86400;

        loadingEl.style.display = 'block';
        loadChunk(baseParams, null);
    }

    function loadChunk(baseParams, cursor) {
        var params = new URLSearchParams(baseParams);
        if (cursor) params.set('cursor', cursor);

        fetch('/locations.php?' + params.toString(), { signal: abortController.signal })
            .then(function(response) { return response.json(); })
            .then(function(json) {
                if (json.features && json.features.length > 0) {
                    L.geoJSON(json, { style: function() { return geoJsonStyle; } })
                        .addTo(layerGroup);
                }

                if (json.hasMore && json.nextCursor) {
                    loadChunk(baseParams, json.nextCursor);
                } else {
                    loadingEl.style.display = 'none';
                }
            })
            .catch(function(e) {
                loadingEl.style.display = 'none';
                if (e.name !== 'AbortError') console.error(e);
            });
    }

    map.on('moveend', function() {
        clearTimeout(moveTimeout);
        moveTimeout = setTimeout(loadViewportData, 300);
    });

    var currentLocationMarker = null;
    var currentLocationCircle = null;
    var locating = false;
    var pendingRecenter = null;
    var locateBtn = document.getElementById('locate-btn');

    function startLocating(recenterMaxZoom) {
        locating = true;
        pendingRecenter = recenterMaxZoom;
        locateBtn.classList.add('active');
        locateBtn.setAttribute('aria-label', 'Stop locating');
        locateBtn.setAttribute('title', 'Stop locating');
        loadingEl.textContent = 'Locating...';
        loadingEl.style.display = 'block';
        map.locate({ watch: true, enableHighAccuracy: true, timeout: 10000 });
    }

    function stopLocating() {
        locating = false;
        pendingRecenter = null;
        locateBtn.classList.remove('active');
        locateBtn.setAttribute('aria-label', 'Locate me');
        locateBtn.setAttribute('title', 'Locate me');
        map.stopLocate();
        if (currentLocationMarker) {
            map.removeLayer(currentLocationMarker);
            currentLocationMarker = null;
        }
        if (currentLocationCircle) {
            map.removeLayer(currentLocationCircle);
            currentLocationCircle = null;
        }
        loadingEl.style.display = 'none';
        loadingEl.textContent = 'Loading...';
    }

    map.on('locationfound', function(e) {
        if (currentLocationMarker) {
            currentLocationMarker.setLatLng(e.latlng);
        } else {
            currentLocationMarker = L.circleMarker(e.latlng, {
                radius: 7,
                color: '#fff',
                weight: 2,
                fillColor: '#006cff',
                fillOpacity: 1,
                pane: 'locationPane',
                renderer: locationRenderer
            }).addTo(map);
        }

        if (currentLocationCircle) {
            currentLocationCircle.setLatLng(e.latlng);
            currentLocationCircle.setRadius(e.accuracy);
        } else {
            currentLocationCircle = L.circle(e.latlng, {
                radius: e.accuracy,
                color: '#006cff',
                weight: 1,
                fillColor: '#006cff',
                fillOpacity: 0.1,
                pane: 'locationPane',
                renderer: locationRenderer
            }).addTo(map);
        }

        if (pendingRecenter !== null) {
            map.setView(e.latlng, pendingRecenter);
            pendingRecenter = null;
        }

        loadingEl.style.display = 'none';
        loadingEl.textContent = 'Loading...';
    });

    map.on('locationerror', function(e) {
        loadingEl.textContent = 'Location unavailable: ' + e.message;
        loadingEl.style.display = 'block';
        setTimeout(function() {
            if (!locating) loadingEl.textContent = 'Loading...';
            loadingEl.style.display = 'none';
        }, 4000);
        if (layerGroup.getLayers().length === 0) fetchLocations();
    });

    locateBtn.addEventListener('click', function() {
        if (locating) {
            stopLocating();
        } else {
            startLocating(16);
        }
    });

    var menuBtn = document.getElementById('menu-btn');
    var menuPanel = document.getElementById('menu-panel');

    function positionMenuPanel() {
        var rect = menuBtn.getBoundingClientRect();
        // Right-align under the button so the panel never overflows the right edge.
        menuPanel.style.right = (window.innerWidth - rect.right) + 'px';
        menuPanel.style.top   = (rect.bottom + 4) + 'px';
        menuPanel.style.left  = 'auto';
    }

    function openMenuPanel() {
        positionMenuPanel();
        menuPanel.hidden = false;
        menuBtn.setAttribute('aria-expanded', 'true');
        loadYearsOnce();
    }

    function closeMenuPanel() {
        menuPanel.hidden = true;
        menuBtn.setAttribute('aria-expanded', 'false');
    }

    menuBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (menuPanel.hidden) {
            openMenuPanel();
        } else {
            closeMenuPanel();
        }
    });
    menuPanel.addEventListener('click', function(e) { e.stopPropagation(); });

    document.addEventListener('click', function() {
        if (!menuPanel.hidden) closeMenuPanel();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !menuPanel.hidden) {
            closeMenuPanel();
        }
    });

    document.getElementById('nativeColor').addEventListener('input', function(e) {
        applyLineColor(e.target.value);
    });
    document.getElementById('reset-color-btn').addEventListener('click', function() {
        applyLineColor(DEFAULT_LINE_COLOR);
    });

    var dateFromEl = document.getElementById('date-from');
    var dateToEl   = document.getElementById('date-to');

    dateFromEl.addEventListener('change', function() {
        setRange(dateFromEl.value, dateToEl.value);
    });
    dateToEl.addEventListener('change', function() {
        setRange(dateFromEl.value, dateToEl.value);
    });

    document.getElementById('date-clear-btn').addEventListener('click', function() {
        setRange(null, null);
    });

    document.querySelectorAll('#menu-panel .preset-row button').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var range = presetRange(btn.getAttribute('data-preset'));
            setRange(range[0], range[1]);
        });
    });

    document.getElementById('year-select').addEventListener('change', function(e) {
        var y = e.target.value;
        if (!y) {
            setRange(null, null);
            return;
        }
        setRange(y + '-01-01', y + '-12-31');
        e.target.value = ''; // reset to placeholder; inputs are the source of truth
    });

    document.getElementById('speed-input').addEventListener('change', function(e) {
        currentSpeed = parseFloat(e.target.value) || 8.5;
        fetchLocations();
    });

    document.getElementById('accuracy-input').addEventListener('change', function(e) {
        var v = parseInt(e.target.value, 10);
        currentAccMax = (isNaN(v) || v <= 0) ? 0 : v;
        fetchLocations();
    });

    applyLineColor(currentLineColor);

    startLocating(INITIAL_ZOOM);
</script>
</body>
</html>
