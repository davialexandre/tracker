<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <style>
        html, body {
            margin: 0;
        }
        #map {
            height: 100vh;
        }
        #loading {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            padding: 8px 16px;
            border-radius: 4px;
            z-index: 1000;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 14px;
        }
        #topbar {
            position: fixed;
            top: 10px;
            left: 60px;
            z-index: 1000;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        #topbar a, #topbar button {
            background: white;
            padding: 6px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 13px;
            color: #006cff;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        #color-btn {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #color-btn .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        #color-panel {
            position: fixed;
            background: white;
            padding: 8px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            z-index: 1000;
            font-family: sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 160px;
        }
        #color-panel[hidden] { display: none; }
        #color-panel .picker-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            color: #333;
        }
        #color-panel .picker-row:hover { background: #f5f5f5; }
        #color-panel .picker-row input[type="color"] {
            width: 30px;
            height: 24px;
            padding: 0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            background: white;
        }
        #color-panel #reset-color-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #333;
            text-align: left;
            font-family: inherit;
        }
        #color-panel #reset-color-btn:hover { background: #f5f5f5; }
        #date-panel {
            position: fixed;
            background: white;
            padding: 8px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            z-index: 1000;
            font-family: sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
        }
        #date-panel[hidden] { display: none; }
        #date-panel .date-row {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333;
        }
        #date-panel .date-row label {
            width: 42px;
        }
        #date-panel .date-row input[type="date"] {
            flex: 1;
            font: inherit;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        #date-panel .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        #date-panel .preset-row button {
            background: white;
            border: 1px solid #ddd;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #006cff;
            font-family: inherit;
        }
        #date-panel .preset-row button:hover { background: #f5f5f5; }
        #date-panel #date-clear-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #333;
            text-align: left;
            font-family: inherit;
        }
        #date-panel #date-clear-btn:hover { background: #f5f5f5; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
    <a id="import-link" href="/import.html">Import GPX</a>
    <button id="locate-btn" type="button">Locate me</button>
    <button id="color-btn" type="button" title="Change line color">
        <span class="swatch"></span>
        <span>Color</span>
    </button>
    <button id="dates-btn" type="button">Dates</button>
</div>
<div id="color-panel" hidden>
    <label class="picker-row">
        <input id="nativeColor" type="color">
        <span>Pick a color</span>
    </label>
    <button id="reset-color-btn" type="button">Reset to default</button>
</div>
<div id="date-panel" hidden>
    <div class="preset-row">
        <button type="button" data-preset="today">Today</button>
        <button type="button" data-preset="this-week">This week</button>
        <button type="button" data-preset="this-month">This month</button>
        <button type="button" data-preset="this-year">This year</button>
        <button type="button" data-preset="last-year">Last year</button>
    </div>
    <div class="date-row">
        <label for="date-from">From</label>
        <input id="date-from" type="date">
    </div>
    <div class="date-row">
        <label for="date-to">To</label>
        <input id="date-to" type="date">
    </div>
    <button id="date-clear-btn" type="button">Clear</button>
</div>
<div id="loading">Loading...</div>
<script type="application/javascript">
    // On phones (viewport < 600px), open and locate at street zoom.
    var INITIAL_ZOOM = window.innerWidth < 600 ? 17 : 14;
    var map = L.map('map', {zoomSnap: 0.25, preferCanvas: true}).setView([-23.54574186833512, -46.608589765419296], INITIAL_ZOOM);
    var CartoDB_Positron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    });

    var currentSpeed = 8.5;
    var currentAccMax = 15; // meters; 0 = no accuracy filter
    var currentFrom = null; // 'YYYY-MM-DD' or null
    var currentTo = null;   // 'YYYY-MM-DD' or null
    var layerGroup = L.layerGroup().addTo(map);
    var abortController = null;
    var moveTimeout = null;
    var loadingEl = document.getElementById('loading');

    var SpeedControl = L.Control.extend({
        onAdd: function() {
            var container = L.DomUtil.create('input');
            container.type = 'number';
            container.min = 0;
            container.step = 0.5;
            container.value = currentSpeed;
            container.title = 'Max speed (m/s)';
            container.onchange = function() {
                currentSpeed = parseFloat(container.value) || 8.5;
                fetchLocations();
            };
            L.DomEvent.disableClickPropagation(container);
            return container;
        }
    });

    var AccuracyControl = L.Control.extend({
        onAdd: function() {
            var container = L.DomUtil.create('input');
            container.type = 'number';
            container.min = 0;
            container.step = 5;
            container.value = currentAccMax;
            container.placeholder = 'acc m';
            container.title = 'Max accuracy radius (m). Empty = no filter.';
            container.onchange = function() {
                var v = parseInt(container.value, 10);
                currentAccMax = (isNaN(v) || v <= 0) ? 0 : v;
                fetchLocations();
            };
            L.DomEvent.disableClickPropagation(container);
            return container;
        }
    });

    (new SpeedControl()).addTo(map);
    (new AccuracyControl()).addTo(map);
    CartoDB_Positron.addTo(map);

    // Dedicated pane (and renderer) for the location dot so it always
    // paints above the line layers regardless of load order.
    map.createPane('locationPane');
    map.getPane('locationPane').style.zIndex = 650;
    var locationRenderer = L.canvas({ pane: 'locationPane' });

    var DEFAULT_LINE_COLOR = '#0d9488';
    var LINE_COLOR_KEY = 'tracker.lineColor';
    var HEX_RE = /^#[0-9a-fA-F]{6}$/;

    function readStoredLineColor() {
        try {
            var v = localStorage.getItem(LINE_COLOR_KEY);
            if (v && HEX_RE.test(v)) return v;
        } catch (e) {}
        return DEFAULT_LINE_COLOR;
    }

    var currentLineColor = readStoredLineColor();
    var geoJsonStyle = { color: currentLineColor, weight: 2 };

    function applyLineColor(hex) {
        currentLineColor = hex;
        geoJsonStyle.color = hex;
        layerGroup.eachLayer(function(layer) {
            layer.setStyle({ color: hex });
        });
        document.querySelector('#color-btn .swatch').style.background = hex;
        document.getElementById('nativeColor').value = hex;
        try { localStorage.setItem(LINE_COLOR_KEY, hex); } catch (e) {}
    }

    function dateStringToUnixStart(yyyyMmDd) {
        // Treat yyyy-mm-dd as local midnight.
        return Math.floor(new Date(yyyyMmDd + 'T00:00:00').getTime() / 1000);
    }

    // Single funnel that every UI path (manual inputs, presets, year dropdown,
    // Clear button) goes through. Keeps the inputs, state vars, and fetch in sync.
    function setRange(from, to) {
        currentFrom = from || null;
        currentTo   = to   || null;
        document.getElementById('date-from').value = currentFrom || '';
        document.getElementById('date-to').value   = currentTo   || '';
        fetchLocations();
    }

    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function fmtDate(d) {
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    // Returns the Monday of the ISO week containing `d`, as a fresh Date at local 00:00.
    function isoWeekMonday(d) {
        var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        // JS getDay(): Sun=0, Mon=1, ..., Sat=6. ISO week starts Monday.
        var dow = m.getDay();
        var diff = (dow === 0) ? -6 : (1 - dow); // shift to Monday
        m.setDate(m.getDate() + diff);
        return m;
    }

    function presetRange(name) {
        var today = new Date();
        var y = today.getFullYear(), mo = today.getMonth();
        switch (name) {
            case 'today':
                return [fmtDate(today), fmtDate(today)];
            case 'this-week': {
                var mon = isoWeekMonday(today);
                var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
                return [fmtDate(mon), fmtDate(sun)];
            }
            case 'this-month': {
                var first = new Date(y, mo, 1);
                var last  = new Date(y, mo + 1, 0); // day 0 of next month = last day of this month
                return [fmtDate(first), fmtDate(last)];
            }
            case 'this-year':
                return [y + '-01-01', y + '-12-31'];
            case 'last-year':
                return [(y - 1) + '-01-01', (y - 1) + '-12-31'];
        }
        return [null, null];
    }

    // Full reset: clear all data and reload for the current viewport.
    // Called on initial load and when speed filter changes.
    function fetchLocations() {
        if (abortController) abortController.abort();
        abortController = new AbortController();
        layerGroup.clearLayers();
        loadViewportData();
    }

    // Load data for the current viewport, accumulating onto existing layers.
    // Called on pan/zoom to fill in newly visible areas without clearing.
    function loadViewportData() {
        if (abortController) abortController.abort();
        abortController = new AbortController();

        var bounds = map.getBounds();
        var baseParams = {
            speed: currentSpeed,
            south: bounds.getSouth(),
            north: bounds.getNorth(),
            west: bounds.getWest(),
            east: bounds.getEast(),
            limit: 100000
        };
        if (currentAccMax > 0) baseParams.acc_max = currentAccMax;
        if (currentFrom) baseParams.from = dateStringToUnixStart(currentFrom);
        if (currentTo)   baseParams.to   = dateStringToUnixStart(currentTo) + 86400;

        loadingEl.style.display = 'block';
        loadChunk(baseParams, null);
    }

    function loadChunk(baseParams, cursor) {
        var params = new URLSearchParams(baseParams);
        if (cursor) params.set('cursor', cursor);

        fetch('/locations.php?' + params.toString(), { signal: abortController.signal })
            .then(function(response) { return response.json(); })
            .then(function(json) {
                if (json.features && json.features.length > 0) {
                    L.geoJSON(json, { style: function() { return geoJsonStyle; } })
                        .addTo(layerGroup);
                }

                if (json.hasMore && json.nextCursor) {
                    loadChunk(baseParams, json.nextCursor);
                } else {
                    loadingEl.style.display = 'none';
                }
            })
            .catch(function(e) {
                loadingEl.style.display = 'none';
                if (e.name !== 'AbortError') console.error(e);
            });
    }

    map.on('moveend', function() {
        clearTimeout(moveTimeout);
        moveTimeout = setTimeout(loadViewportData, 300);
    });

    var currentLocationMarker = null;
    var currentLocationCircle = null;
    var locating = false;
    var pendingRecenter = null;
    var locateBtn = document.getElementById('locate-btn');

    function startLocating(recenterMaxZoom) {
        locating = true;
        pendingRecenter = recenterMaxZoom;
        locateBtn.textContent = 'Stop locating';
        loadingEl.textContent = 'Locating...';
        loadingEl.style.display = 'block';
        map.locate({ watch: true, enableHighAccuracy: true, timeout: 10000 });
    }

    function stopLocating() {
        locating = false;
        pendingRecenter = null;
        locateBtn.textContent = 'Locate me';
        map.stopLocate();
        if (currentLocationMarker) {
            map.removeLayer(currentLocationMarker);
            currentLocationMarker = null;
        }
        if (currentLocationCircle) {
            map.removeLayer(currentLocationCircle);
            currentLocationCircle = null;
        }
        loadingEl.style.display = 'none';
        loadingEl.textContent = 'Loading...';
    }

    map.on('locationfound', function(e) {
        if (currentLocationMarker) {
            currentLocationMarker.setLatLng(e.latlng);
        } else {
            currentLocationMarker = L.circleMarker(e.latlng, {
                radius: 7,
                color: '#fff',
                weight: 2,
                fillColor: '#006cff',
                fillOpacity: 1,
                pane: 'locationPane',
                renderer: locationRenderer
            }).addTo(map);
        }

        if (currentLocationCircle) {
            currentLocationCircle.setLatLng(e.latlng);
            currentLocationCircle.setRadius(e.accuracy);
        } else {
            currentLocationCircle = L.circle(e.latlng, {
                radius: e.accuracy,
                color: '#006cff',
                weight: 1,
                fillColor: '#006cff',
                fillOpacity: 0.1,
                pane: 'locationPane',
                renderer: locationRenderer
            }).addTo(map);
        }

        if (pendingRecenter !== null) {
            map.setView(e.latlng, pendingRecenter);
            pendingRecenter = null;
        }

        loadingEl.style.display = 'none';
        loadingEl.textContent = 'Loading...';
    });

    map.on('locationerror', function(e) {
        loadingEl.textContent = 'Location unavailable: ' + e.message;
        loadingEl.style.display = 'block';
        setTimeout(function() {
            if (!locating) loadingEl.textContent = 'Loading...';
            loadingEl.style.display = 'none';
        }, 4000);
        if (layerGroup.getLayers().length === 0) fetchLocations();
    });

    locateBtn.addEventListener('click', function() {
        if (locating) {
            stopLocating();
        } else {
            startLocating(16);
        }
    });

    var colorBtn = document.getElementById('color-btn');
    var colorPanel = document.getElementById('color-panel');

    function positionColorPanel() {
        var rect = colorBtn.getBoundingClientRect();
        colorPanel.style.left = rect.left + 'px';
        colorPanel.style.top = (rect.bottom + 4) + 'px';
    }

    colorBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        datePanel.hidden = true;
        if (colorPanel.hidden) {
            positionColorPanel();
            colorPanel.hidden = false;
        } else {
            colorPanel.hidden = true;
        }
    });
    colorPanel.addEventListener('click', function(e) { e.stopPropagation(); });
    document.addEventListener('click', function() {
        if (!colorPanel.hidden) colorPanel.hidden = true;
        if (!datePanel.hidden) datePanel.hidden = true;
    });

    document.getElementById('nativeColor').addEventListener('input', function(e) {
        applyLineColor(e.target.value);
    });
    document.getElementById('reset-color-btn').addEventListener('click', function() {
        applyLineColor(DEFAULT_LINE_COLOR);
    });

    var datesBtn  = document.getElementById('dates-btn');
    var datePanel = document.getElementById('date-panel');
    var dateFromEl = document.getElementById('date-from');
    var dateToEl   = document.getElementById('date-to');

    function positionDatePanel() {
        var rect = datesBtn.getBoundingClientRect();
        datePanel.style.left = rect.left + 'px';
        datePanel.style.top  = (rect.bottom + 4) + 'px';
    }

    datesBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        colorPanel.hidden = true;
        if (datePanel.hidden) {
            positionDatePanel();
            datePanel.hidden = false;
        } else {
            datePanel.hidden = true;
        }
    });
    datePanel.addEventListener('click', function(e) { e.stopPropagation(); });

    dateFromEl.addEventListener('change', function() {
        setRange(dateFromEl.value, dateToEl.value);
    });
    dateToEl.addEventListener('change', function() {
        setRange(dateFromEl.value, dateToEl.value);
    });

    document.getElementById('date-clear-btn').addEventListener('click', function() {
        setRange(null, null);
    });

    document.querySelectorAll('#date-panel .preset-row button').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var range = presetRange(btn.getAttribute('data-preset'));
            setRange(range[0], range[1]);
        });
    });

    applyLineColor(currentLineColor);

    startLocating(INITIAL_ZOOM);
</script>
</body>
</html>
