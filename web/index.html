<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <style>
        html, body {
            margin: 0;
        }
        #map {
            height: 100vh;
        }
        #loading {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            padding: 8px 16px;
            border-radius: 4px;
            z-index: 1000;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 14px;
        }
        #topbar {
            position: fixed;
            top: 10px;
            left: 60px;
            z-index: 1000;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        #topbar a, #topbar button {
            background: white;
            padding: 6px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 13px;
            color: #006cff;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        #color-btn {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #color-btn .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        #color-panel {
            position: fixed;
            background: white;
            padding: 8px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            z-index: 1000;
            font-family: sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 160px;
        }
        #color-panel[hidden] { display: none; }
        #color-panel .picker-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            color: #333;
        }
        #color-panel .picker-row:hover { background: #f5f5f5; }
        #color-panel .picker-row input[type="color"] {
            width: 30px;
            height: 24px;
            padding: 0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            background: white;
        }
        #color-panel #reset-color-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #333;
            text-align: left;
            font-family: inherit;
        }
        #color-panel #reset-color-btn:hover { background: #f5f5f5; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
    <a id="import-link" href="/import.html">Import GPX</a>
    <button id="locate-btn" type="button">Locate me</button>
    <button id="color-btn" type="button" title="Change line color">
        <span class="swatch"></span>
        <span>Color</span>
    </button>
</div>
<div id="color-panel" hidden>
    <label class="picker-row">
        <input id="nativeColor" type="color">
        <span>Pick a color</span>
    </label>
    <button id="reset-color-btn" type="button">Reset to default</button>
</div>
<div id="loading">Loading...</div>
<script type="application/javascript">
    var map = L.map('map', {zoomSnap: 0.25, preferCanvas: true}).setView([-23.54574186833512, -46.608589765419296], 14);
    var CartoDB_Positron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    });

    var currentSpeed = 8.5;
    var layerGroup = L.layerGroup().addTo(map);
    var abortController = null;
    var moveTimeout = null;
    var loadingEl = document.getElementById('loading');

    var SpeedControl = L.Control.extend({
        onAdd: function() {
            var container = L.DomUtil.create('input');
            container.type = 'number';
            container.min = 0;
            container.step = 0.5;
            container.value = currentSpeed;
            container.onchange = function() {
                currentSpeed = parseFloat(container.value) || 8.5;
                fetchLocations();
            };
            L.DomEvent.disableClickPropagation(container);
            return container;
        }
    });

    (new SpeedControl()).addTo(map);
    CartoDB_Positron.addTo(map);

    // Dedicated pane (and renderer) for the location dot so it always
    // paints above the line layers regardless of load order.
    map.createPane('locationPane');
    map.getPane('locationPane').style.zIndex = 650;
    var locationRenderer = L.canvas({ pane: 'locationPane' });

    var DEFAULT_LINE_COLOR = '#0d9488';
    var LINE_COLOR_KEY = 'tracker.lineColor';
    var HEX_RE = /^#[0-9a-fA-F]{6}$/;

    function readStoredLineColor() {
        try {
            var v = localStorage.getItem(LINE_COLOR_KEY);
            if (v && HEX_RE.test(v)) return v;
        } catch (e) {}
        return DEFAULT_LINE_COLOR;
    }

    var currentLineColor = readStoredLineColor();
    var geoJsonStyle = { color: currentLineColor, weight: 2 };

    function applyLineColor(hex) {
        currentLineColor = hex;
        geoJsonStyle.color = hex;
        layerGroup.eachLayer(function(layer) {
            layer.setStyle({ color: hex });
        });
        document.querySelector('#color-btn .swatch').style.background = hex;
        document.getElementById('nativeColor').value = hex;
        try { localStorage.setItem(LINE_COLOR_KEY, hex); } catch (e) {}
    }

    // Full reset: clear all data and reload for the current viewport.
    // Called on initial load and when speed filter changes.
    function fetchLocations() {
        if (abortController) abortController.abort();
        abortController = new AbortController();
        layerGroup.clearLayers();
        loadViewportData();
    }

    // Load data for the current viewport, accumulating onto existing layers.
    // Called on pan/zoom to fill in newly visible areas without clearing.
    function loadViewportData() {
        if (abortController) abortController.abort();
        abortController = new AbortController();

        var bounds = map.getBounds();
        var baseParams = {
            speed: currentSpeed,
            south: bounds.getSouth(),
            north: bounds.getNorth(),
            west: bounds.getWest(),
            east: bounds.getEast(),
            limit: 100000
        };

        loadingEl.style.display = 'block';
        loadChunk(baseParams, null);
    }

    function loadChunk(baseParams, cursor) {
        var params = new URLSearchParams(baseParams);
        if (cursor) params.set('cursor', cursor);

        fetch('/locations.php?' + params.toString(), { signal: abortController.signal })
            .then(function(response) { return response.json(); })
            .then(function(json) {
                if (json.features && json.features.length > 0) {
                    L.geoJSON(json, { style: function() { return geoJsonStyle; } })
                        .addTo(layerGroup);
                }

                if (json.hasMore && json.nextCursor) {
                    loadChunk(baseParams, json.nextCursor);
                } else {
                    loadingEl.style.display = 'none';
                }
            })
            .catch(function(e) {
                loadingEl.style.display = 'none';
                if (e.name !== 'AbortError') console.error(e);
            });
    }

    map.on('moveend', function() {
        clearTimeout(moveTimeout);
        moveTimeout = setTimeout(loadViewportData, 300);
    });

    var currentLocationMarker = null;
    var currentLocationCircle = null;
    var locating = false;
    var pendingRecenter = null;
    var locateBtn = document.getElementById('locate-btn');

    function startLocating(recenterMaxZoom) {
        locating = true;
        pendingRecenter = recenterMaxZoom;
        locateBtn.textContent = 'Stop locating';
        loadingEl.textContent = 'Locating...';
        loadingEl.style.display = 'block';
        map.locate({ watch: true, enableHighAccuracy: true, timeout: 10000 });
    }

    function stopLocating() {
        locating = false;
        pendingRecenter = null;
        locateBtn.textContent = 'Locate me';
        map.stopLocate();
        if (currentLocationMarker) {
            map.removeLayer(currentLocationMarker);
            currentLocationMarker = null;
        }
        if (currentLocationCircle) {
            map.removeLayer(currentLocationCircle);
            currentLocationCircle = null;
        }
        loadingEl.style.display = 'none';
        loadingEl.textContent = 'Loading...';
    }

    map.on('locationfound', function(e) {
        if (currentLocationMarker) {
            currentLocationMarker.setLatLng(e.latlng);
        } else {
            currentLocationMarker = L.circleMarker(e.latlng, {
                radius: 7,
                color: '#fff',
                weight: 2,
                fillColor: '#006cff',
                fillOpacity: 1,
                pane: 'locationPane',
                renderer: locationRenderer
            }).addTo(map);
        }

        if (currentLocationCircle) {
            currentLocationCircle.setLatLng(e.latlng);
            currentLocationCircle.setRadius(e.accuracy);
        } else {
            currentLocationCircle = L.circle(e.latlng, {
                radius: e.accuracy,
                color: '#006cff',
                weight: 1,
                fillColor: '#006cff',
                fillOpacity: 0.1,
                pane: 'locationPane',
                renderer: locationRenderer
            }).addTo(map);
        }

        if (pendingRecenter !== null) {
            var bounds = e.latlng.toBounds(e.accuracy * 2);
            var zoom = Math.min(map.getBoundsZoom(bounds), pendingRecenter);
            map.setView(e.latlng, zoom);
            pendingRecenter = null;
        }

        loadingEl.style.display = 'none';
        loadingEl.textContent = 'Loading...';
    });

    map.on('locationerror', function(e) {
        loadingEl.textContent = 'Location unavailable: ' + e.message;
        loadingEl.style.display = 'block';
        setTimeout(function() {
            if (!locating) loadingEl.textContent = 'Loading...';
            loadingEl.style.display = 'none';
        }, 4000);
        if (layerGroup.getLayers().length === 0) fetchLocations();
    });

    locateBtn.addEventListener('click', function() {
        if (locating) {
            stopLocating();
        } else {
            startLocating(16);
        }
    });

    var colorBtn = document.getElementById('color-btn');
    var colorPanel = document.getElementById('color-panel');

    function positionColorPanel() {
        var rect = colorBtn.getBoundingClientRect();
        colorPanel.style.left = rect.left + 'px';
        colorPanel.style.top = (rect.bottom + 4) + 'px';
    }

    colorBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (colorPanel.hidden) {
            positionColorPanel();
            colorPanel.hidden = false;
        } else {
            colorPanel.hidden = true;
        }
    });
    colorPanel.addEventListener('click', function(e) { e.stopPropagation(); });
    document.addEventListener('click', function() {
        if (!colorPanel.hidden) colorPanel.hidden = true;
    });

    document.getElementById('nativeColor').addEventListener('input', function(e) {
        applyLineColor(e.target.value);
    });
    document.getElementById('reset-color-btn').addEventListener('click', function() {
        applyLineColor(DEFAULT_LINE_COLOR);
    });

    applyLineColor(currentLineColor);

    startLocating(14);
</script>
</body>
</html>
